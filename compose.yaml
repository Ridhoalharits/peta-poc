# Fixed project name so it never mixes with another compose project in a folder also called "web".
name: peta-poc

services:
  peta-poc:
    build:
      context: .
      # platforms: [linux/amd64]   # uncomment when the target server is x86
    image: peta-poc:0.1.0
    container_name: peta-poc
    ports:
      - "${HOST_PORT:-3000}:3000"
    #  - "${HOST_PORT:-8016}:5224" # uncomment when on server deployment
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
